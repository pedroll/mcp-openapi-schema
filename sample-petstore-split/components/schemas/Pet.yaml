type: object
required:
  - id
  - name
properties:
  id:
    type: integer
    format: int64
    description: Unique identifier for the pet
  name:
    type: string
    description: Name of the pet
  status:
    type: string
    description: Status of the pet
    enum:
      - available
      - pending
      - sold
    default: available
  category:
    $ref: './Category.yaml'
